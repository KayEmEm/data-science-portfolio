name: CI

on:
  push:
  pull_request:

permissions:
  contents: read
  pull-requests: read  # paths-filter lists the changed files of a pull request

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      common: ${{ steps.filter.outputs.common }}
      p01: ${{ steps.filter.outputs.p01 }}
      p02: ${{ steps.filter.outputs.p02 }}
      p03: ${{ steps.filter.outputs.p03 }}
      p04: ${{ steps.filter.outputs.p04 }}
      p05: ${{ steps.filter.outputs.p05 }}
      p06: ${{ steps.filter.outputs.p06 }}
      p07: ${{ steps.filter.outputs.p07 }}
      p08: ${{ steps.filter.outputs.p08 }}
      p09: ${{ steps.filter.outputs.p09 }}
      p10: ${{ steps.filter.outputs.p10 }}
      p11: ${{ steps.filter.outputs.p11 }}
      p12: ${{ steps.filter.outputs.p12 }}
      p13: ${{ steps.filter.outputs.p13 }}
      p14: ${{ steps.filter.outputs.p14 }}
    steps:
      - uses: actions/checkout@v4
      - id: filter
        uses: dorny/paths-filter@v3
        with:
          filters: |
            common:
              - 'common/**'
              - '.github/workflows/**'
            p01:
              - 'common/**'
              - 'projects/p01_loan_default/**'
              - '.github/workflows/**'
            p02:
              - 'common/**'
              - 'projects/p02_filings_qa/**'
              - '.github/workflows/**'
            p03:
              - 'common/**'
              - 'projects/p03_taxi_demand/**'
              - '.github/workflows/**'
            p04:
              - 'common/**'
              - 'projects/p04_email_uplift/**'
              - '.github/workflows/**'
            p05:
              - 'common/**'
              - 'projects/p05_retail_forecasting/**'
              - '.github/workflows/**'
            p06:
              - 'common/**'
              - 'projects/p06_road_damage/**'
              - '.github/workflows/**'
            p07:
              - 'common/**'
              - 'projects/p07_movie_recommender/**'
              - '.github/workflows/**'
            p08:
              - 'common/**'
              - 'projects/p08_network_anomaly/**'
              - '.github/workflows/**'
            p09:
              - 'common/**'
              - 'projects/p09_customer_segments/**'
              - '.github/workflows/**'
            p10:
              - 'common/**'
              - 'projects/p10_delivery_planning/**'
              - '.github/workflows/**'
            p11:
              - 'common/**'
              - 'projects/p11_illicit_transactions/**'
              - '.github/workflows/**'
            p12:
              - 'common/**'
              - 'projects/p12_inventory_control/**'
              - '.github/workflows/**'
            p13:
              - 'common/**'
              - 'projects/p01_loan_default/**'
              - 'projects/p06_road_damage/**'
              - 'projects/p08_network_anomaly/**'
              - 'projects/p13_adversarial_robustness/**'
              - '.github/workflows/**'
            p14:
              - 'projects/p14_linear_crawler/**'
              - '.github/workflows/**'

  common:
    needs: changes
    if: needs.changes.outputs.common == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: common
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: python -m pip install -e ".[dev]"
      - run: python -m ruff check .
      - run: python -m ruff format --check .
      - run: python -m pytest -q

  p01_loan_default:
    needs: changes
    if: needs.changes.outputs.p01 == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: projects/p01_loan_default
    env:
      MLFLOW_DISABLE_AGENT_HINT: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: python -m pip install -e ../../common -e ".[dev]"
      - run: make lint
      - run: make test
      - name: Smoke run of the full pipeline on synthetic tables
        run: make smoke

  p02_filings_qa:
    needs: changes
    if: needs.changes.outputs.p02 == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: projects/p02_filings_qa
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: python -m pip install -e ../../common -e ".[dev]"
      - run: make lint
      - run: make test
      - name: Smoke run of the free pipeline on a synthetic corpus (no download, no paid call)
        run: make smoke

  p03_taxi_demand:
    needs: changes
    if: needs.changes.outputs.p03 == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: projects/p03_taxi_demand
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: python -m pip install -e ../../common -e ".[dev]"
      - run: make lint
      - run: make test
      - name: Smoke run of the warehouse and report on synthetic files (no download)
        run: make smoke

  p04_email_uplift:
    needs: changes
    if: needs.changes.outputs.p04 == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: projects/p04_email_uplift
    env:
      MLFLOW_DISABLE_AGENT_HINT: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      # CausalML is left out here: it compiles from source on this Python version.
      # The pipeline and tests skip its learner when it is absent.
      - run: python -m pip install -e ../../common -e ".[dev]"
      - run: make lint
      - run: make test
      - name: Smoke run of the full pipeline on synthetic customers (no download)
        run: make smoke

  p05_retail_forecasting:
    needs: changes
    if: needs.changes.outputs.p05 == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: projects/p05_retail_forecasting
    env:
      MLFLOW_DISABLE_AGENT_HINT: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      # Darts with PyTorch (the neural extra) is left out here: it is a large install.
      # The pipeline and tests skip the N-HiTS model when it is absent.
      - run: python -m pip install -e ../../common -e ".[dev]"
      - run: make lint
      - run: make test
      - name: Smoke run of the full pipeline on a synthetic archive (no download)
        run: make smoke

  p06_road_damage:
    needs: changes
    if: needs.changes.outputs.p06 == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: projects/p06_road_damage
    env:
      MLFLOW_DISABLE_AGENT_HINT: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      # The CPU builds of PyTorch and torchvision first, together, so that the project install pulls
      # neither the CUDA build (several GB) nor a torchvision built for another PyTorch.
      - run: python -m pip install torch==2.14.1 torchvision==0.29.1 --index-url https://download.pytorch.org/whl/cpu
      - run: python -m pip install -e ../../common -e ".[dev]"
      - run: make lint
      - run: make test
      - name: Smoke run of the full pipeline on synthetic zips (untrained weights, no data download)
        run: make smoke

  p07_movie_recommender:
    needs: changes
    if: needs.changes.outputs.p07 == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: projects/p07_movie_recommender
    env:
      MLFLOW_DISABLE_AGENT_HINT: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      # The CPU build of PyTorch first, so that the project install does not pull the CUDA build (several GB).
      - run: python -m pip install torch==2.14.1 --index-url https://download.pytorch.org/whl/cpu
      - run: python -m pip install -e ../../common -e ".[dev]"
      - run: make lint
      - run: make test
      - name: Smoke run of the full pipeline on a synthetic archive (no download)
        run: make smoke

  p08_network_anomaly:
    needs: changes
    if: needs.changes.outputs.p08 == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: projects/p08_network_anomaly
    env:
      MLFLOW_DISABLE_AGENT_HINT: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      # The CPU build of PyTorch first, so that the project install does not pull the CUDA build (several GB).
      - run: python -m pip install torch==2.14.1 --index-url https://download.pytorch.org/whl/cpu
      - run: python -m pip install -e ../../common -e ".[dev]"
      - run: make lint
      - run: make test
      - name: Smoke run of the full pipeline on synthetic flows (no data download)
        run: make smoke

  p09_customer_segments:
    needs: changes
    if: needs.changes.outputs.p09 == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: projects/p09_customer_segments
    env:
      MLFLOW_DISABLE_AGENT_HINT: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: python -m pip install -e ../../common -e ".[dev]"
      - run: make lint
      - run: make test
      - name: Smoke run of the full pipeline on synthetic order lines (no data download)
        run: make smoke

  p10_delivery_planning:
    needs: changes
    if: needs.changes.outputs.p10 == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: projects/p10_delivery_planning
    env:
      MLFLOW_DISABLE_AGENT_HINT: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      # Gurobi (the optional extra) is installed too: its pip license is size limited, and the small
      # scenarios of the smoke run fit it.
      - run: python -m pip install -e ../../common -e ".[dev,gurobi]"
      - run: make lint
      - run: make test
      - name: Smoke run of the full pipeline on synthetic instances (no data download)
        run: make smoke

  p11_illicit_transactions:
    needs: changes
    if: needs.changes.outputs.p11 == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: projects/p11_illicit_transactions
    env:
      MLFLOW_DISABLE_AGENT_HINT: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      # The CPU build of PyTorch first, so that the project install does not pull the CUDA build (several GB).
      # PyTorch Geometric is pure Python and needs no compiled extension.
      - run: python -m pip install torch==2.14.1 --index-url https://download.pytorch.org/whl/cpu
      - run: python -m pip install -e ../../common -e ".[dev]"
      - run: make lint
      - run: make test
      - name: Smoke run of the full pipeline on a synthetic graph (no data download, no Neo4j server)
        run: make smoke

  p12_inventory_control:
    needs: changes
    if: needs.changes.outputs.p12 == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: projects/p12_inventory_control
    env:
      MLFLOW_DISABLE_AGENT_HINT: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      # The CPU build of PyTorch first, so that the project install does not pull the CUDA build (several GB).
      - run: python -m pip install torch==2.14.1 --index-url https://download.pytorch.org/whl/cpu
      - run: python -m pip install -e ../../common -e ".[dev]"
      - run: make lint
      - run: make test
      - name: Smoke run of the full pipeline on a synthetic archive (tiny training runs, no data download)
        run: make smoke

  p13_adversarial_robustness:
    needs: changes
    if: needs.changes.outputs.p13 == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: projects/p13_adversarial_robustness
    env:
      MLFLOW_DISABLE_AGENT_HINT: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      # The CPU build of PyTorch first, so that the project install does not pull the CUDA build (several GB).
      - run: python -m pip install torch==2.14.1 torchvision==0.29.1 --index-url https://download.pytorch.org/whl/cpu
      # The target projects 1, 6 and 8 are installed from their folders; their models are rebuilt from their code.
      - run: python -m pip install -e ../../common -e ../p01_loan_default -e ../p06_road_damage -e ../p08_network_anomaly -e ".[dev]"
      - run: make lint
      - run: make test
      - name: Smoke run of the full pipeline on synthetic sources and an untrained detector (no data download)
        run: make smoke

  p14_linear_crawler:
    needs: changes
    if: needs.changes.outputs.p14 == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: projects/p14_linear_crawler
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      # The project does not use the common package.
      - run: python -m pip install -e ".[dev]"
      # Chromium with its system libraries; xvfb for the virtual display tests.
      - run: python -m playwright install --with-deps chromium
      - run: sudo apt-get install -y xvfb
      - run: make lint
      - run: make test
      - name: Smoke run of a full crawl of the synthetic site (no real site contacted)
        run: make smoke
