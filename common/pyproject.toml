[build-system]
requires = ["uv_build>=0.11.32,<0.12"]
build-backend = "uv_build"

[project]
name = "portfolio-common"
version = "0.1.0"
description = "Shared utilities for the data science portfolio projects"
requires-python = ">=3.12"
license = "MIT"
dependencies = [
    "numpy==2.5.4",
    "pandas==3.1.0",
    "scikit-learn==1.9.1",
    "matplotlib==3.11.2",
    "pyyaml==6.0.3",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]

[dependency-groups]
dev = ["pytest==9.1.1", "ruff==0.17.2"]
