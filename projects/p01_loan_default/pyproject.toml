[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "loan-default"
version = "0.1.0"
description = "Loan default risk model with calibrated probabilities and a cost based approval threshold"
requires-python = ">=3.11"
license = "MIT"
dependencies = [
    "duckdb==2.0.0",
    "numpy==2.5.4",
    "pandas==3.1.0",
    "pyarrow==25.0.1",
    "scikit-learn==1.9.1",
    "lightgbm==4.7.0",
    "xgboost==3.4.1",
    "shap==0.54.1",
    "matplotlib==3.11.2",
    "tabulate==0.10.0",
    "mlflow==3.17.2",
    "joblib==1.6.0",
    "fastapi==0.161.1",
    "uvicorn==0.54.0",
    "pydantic==2.14.1",
]

[project.optional-dependencies]
data = ["kaggle==2.2.5"]
dev = ["pytest==9.1.1", "ruff==0.17.2", "httpx==0.28.1"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"loan_default.sql" = ["*.sql"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 110
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]
