[build-system]
requires = ["uv_build>=0.11.32,<0.12"]
build-backend = "uv_build"

[project]
name = "loan-default"
version = "0.1.0"
description = "Credit default risk model with calibrated probabilities and a cost based approval threshold"
requires-python = ">=3.12"
license = "MIT"
dependencies = [
    "portfolio-common",
    "duckdb==2.0.0",
    "numpy==2.5.4",
    "pandas==3.1.0",
    "pyarrow==25.0.1",
    "scikit-learn==1.9.1",
    "lightgbm==4.7.0",
    "xgboost==3.4.1",
    "shap==0.54.1",
    "matplotlib==3.11.2",
    "tabulate==0.10.0",
    "python-calamine==0.9.0",
    "mlflow==3.17.2",
    "joblib==1.6.0",
    "fastapi==0.161.1",
    "uvicorn==0.54.0",
    "pydantic==2.14.1",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 110
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]

[tool.uv.sources]
portfolio-common = {path = "../../common", editable = true}

[dependency-groups]
dev = ["pytest==9.1.1", "ruff==0.17.2", "httpx==0.28.1"]
