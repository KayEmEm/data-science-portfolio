[build-system]
requires = ["uv_build>=0.11.32,<0.12"]
build-backend = "uv_build"

[project]
name = "filings-qa"
version = "0.1.0"
description = "Question answering over company filings with cited passages, and its evaluation"
requires-python = ">=3.12"
license = "MIT"
dependencies = [
    "portfolio-common",
    "numpy==2.5.4",
    "pandas==3.1.0",
    "pyarrow==25.0.1",
    "scipy==1.18.1",
    "scikit-learn==1.9.1",
    "joblib==1.6.0",
    "pypdf==6.21.2",
    "chromadb==1.5.9",
    "anthropic==2.2.0",
    "matplotlib==3.11.2",
    "tabulate==0.10.0",
]

[project.optional-dependencies]
demo = ["gradio==6.30.0"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 110
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]

[tool.uv.sources]
portfolio-common = {path = "../../common", editable = true}

[dependency-groups]
dev = ["pytest==9.1.1", "ruff==0.17.2"]
