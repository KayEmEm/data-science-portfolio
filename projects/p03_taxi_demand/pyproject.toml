[build-system]
requires = ["uv_build>=0.11.32,<0.12"]
build-backend = "uv_build"

[project]
name = "taxi-demand"
version = "0.1.0"
description = "Exploratory analysis of New York taxi demand, fares and tips, with a dashboard mock up"
requires-python = ">=3.12"
license = "MIT"
dependencies = [
    "portfolio-common",
    "duckdb==2.0.0",
    "numpy==2.5.4",
    "pandas==3.1.0",
    "pyarrow==25.0.1",
    "matplotlib==3.11.2",
    "plotly==7.1.0",
    "streamlit==1.66.1",
    "tabulate==0.10.0",
]

[project.optional-dependencies]
notebook = ["nbformat==5.11.1", "nbclient==0.11.0", "ipykernel==7.4.0"]
screenshots = ["playwright==1.64.1"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 110
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]

[tool.uv.sources]
portfolio-common = {path = "../../common", editable = true}

[dependency-groups]
dev = ["pytest==9.1.1", "ruff==0.17.2"]
