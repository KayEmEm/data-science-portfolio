[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "taxi-demand"
version = "0.1.0"
description = "Exploratory analysis of New York taxi demand, fares and tips, with a dashboard mock up"
requires-python = ">=3.11"
license = "MIT"
dependencies = [
    "duckdb==2.0.0",
    "numpy==2.5.4",
    "pandas==3.1.0",
    "pyarrow==25.0.1",
    "matplotlib==3.11.2",
    "plotly==7.1.0",
    "streamlit==1.66.1",
    "tabulate==0.10.0",
]

[project.optional-dependencies]
notebook = ["nbformat==5.11.1", "nbclient==0.11.0", "ipykernel==7.4.0"]
screenshots = ["playwright==1.64.1"]
dev = ["pytest==9.1.1", "ruff==0.17.2"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"taxi_demand.sql" = ["*.sql", "analysis/*.sql"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 110
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]
