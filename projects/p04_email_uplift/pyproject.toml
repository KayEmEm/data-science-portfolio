[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "email-uplift"
version = "0.1.0"
description = "Readout of a randomized email experiment, uplift models and a targeting policy"
requires-python = ">=3.11"
license = "MIT"
dependencies = [
    "numpy==2.5.4",
    "pandas==3.1.0",
    "pyarrow==25.0.1",
    "scipy==1.18.1",
    "statsmodels==0.15.0",
    "scikit-learn==1.9.1",
    "lightgbm==4.7.0",
    "econml==0.17.0",
    "dowhy==0.14",
    "matplotlib==3.11.2",
    "tabulate==0.10.0",
    "mlflow==3.17.2",
]

[project.optional-dependencies]
# CausalML has no wheel for every Python version and may compile from source.
# Without it the pipeline skips the CausalML doubly robust learner.
causalml = ["causalml==0.18.0"]
dev = ["pytest==9.1.1", "ruff==0.17.2"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 110
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]
