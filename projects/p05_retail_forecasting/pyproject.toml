[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "retail-forecast"
version = "0.1.0"
description = "Daily demand forecasts 28 days ahead for the M5 Walmart hierarchy, with prediction intervals"
requires-python = ">=3.11"
license = "MIT"
dependencies = [
    "numpy==2.5.4",
    "pandas==3.1.0",
    "pyarrow==25.0.1",
    "scipy==1.18.1",
    "statsmodels==0.15.0",
    "scikit-learn==1.9.1",
    "lightgbm==4.7.0",
    "prophet==1.5.0",
    "matplotlib==3.11.2",
    "tabulate==0.10.0",
    "mlflow==3.17.2",
]

[project.optional-dependencies]
# Darts with PyTorch is a large install (about 1 GB). Without it the pipeline
# skips the neural model and runs every other model.
neural = ["darts[torch]==0.48.1"]
dev = ["pytest==9.1.1", "ruff==0.17.2"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 110
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]
