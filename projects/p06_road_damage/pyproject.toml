[build-system]
requires = ["uv_build>=0.11.32,<0.12"]
build-backend = "uv_build"

[project]
name = "road-damage"
version = "0.1.0"
description = "Road damage detection on RDD2022 (Czech and India) with YOLO11n, trained on CPU"
requires-python = ">=3.12"
# Ultralytics is AGPL-3.0, and Ultralytics states that code which uses it falls
# under the same license. This folder is therefore AGPL-3.0, unlike the rest of
# the repository (MIT). See LICENSE in this folder.
license = "AGPL-3.0-only"
dependencies = [
    "portfolio-common",
    "ultralytics==8.4.184",
    "torch==2.14.1",
    "torchvision==0.29.1",
    "onnx==1.23.2",
    "onnxruntime==1.31.0",
    "onnxslim==0.1.98",
    "numpy==2.5.4",
    "pandas==3.1.0",
    "pyarrow==25.0.1",
    "pillow==12.3.0",
    "pyyaml==6.0.3",
    "matplotlib==3.11.2",
    "tabulate==0.10.0",
    "mlflow==3.17.2",
]
license-files = ["LICENSE"]

[project.optional-dependencies]
demo = ["gradio==6.30.0"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 110
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]

[tool.uv.sources]
portfolio-common = {path = "../../common", editable = true}
torch = {index = "pytorch-cpu"}
torchvision = {index = "pytorch-cpu"}

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[dependency-groups]
dev = ["pytest==9.1.1", "ruff==0.17.2"]
