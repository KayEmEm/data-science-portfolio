[build-system]
requires = ["uv_build>=0.11.32,<0.12"]
build-backend = "uv_build"

[project]
name = "movie-recs"
version = "0.1.0"
description = "Top 10 movie recommendations on MovieLens 32M: popularity, implicit ALS, a two tower model with FAISS and a LightGBM ranker"
requires-python = ">=3.12"
license = "MIT"
dependencies = [
    "portfolio-common",
    "numpy==2.5.4",
    "pandas==3.1.0",
    "pyarrow==25.0.1",
    "scipy==1.18.1",
    "threadpoolctl==3.7.0",
    "implicit==0.7.3",
    "torch==2.14.1",
    "faiss-cpu==1.15.1",
    "lightgbm==4.7.0",
    "matplotlib==3.11.2",
    "tabulate==0.10.0",
    "mlflow==3.17.2",
]

[project.optional-dependencies]
demo = ["streamlit==1.66.1"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 110
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]

[tool.uv.sources]
portfolio-common = {path = "../../common", editable = true}
torch = {index = "pytorch-cpu"}

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[dependency-groups]
dev = ["pytest==9.1.1", "ruff==0.17.2"]
