[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "movie-recs"
version = "0.1.0"
description = "Top 10 movie recommendations on MovieLens 32M: popularity, implicit ALS, a two tower model with FAISS and a LightGBM ranker"
requires-python = ">=3.11"
license = "MIT"
dependencies = [
    "numpy==2.5.4",
    "pandas==3.1.0",
    "pyarrow==25.0.1",
    "scipy==1.18.1",
    "threadpoolctl==3.7.0",
    "implicit==0.7.3",
    "torch==2.14.1",
    "faiss-cpu==1.15.1",
    "lightgbm==4.7.0",
    "matplotlib==3.11.2",
    "tabulate==0.10.0",
    "mlflow==3.17.2",
]

[project.optional-dependencies]
demo = ["streamlit==1.66.1"]
dev = ["pytest==9.1.1", "ruff==0.17.2"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 110
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]
