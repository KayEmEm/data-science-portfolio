[build-system]
requires = ["uv_build>=0.11.32,<0.12"]
build-backend = "uv_build"

[project]
name = "flow-anomaly"
version = "0.1.0"
description = "Unsupervised detection of attack traffic in UNSW-NB15 network flows: Isolation Forest, LOF, PyOD detectors and an autoencoder, with a supervised LightGBM reference"
requires-python = ">=3.12"
license = "MIT"
dependencies = [
    "portfolio-common",
    "numpy==2.5.4",
    "pandas==3.1.0",
    "pyarrow==25.0.1",
    "scikit-learn==1.9.1",
    "pyod==3.6.7",
    "torch==2.14.1",
    "lightgbm==4.7.0",
    "joblib==1.6.0",
    "matplotlib==3.11.2",
    "tabulate==0.10.0",
    "mlflow==3.17.2",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 110
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]

[tool.uv.sources]
portfolio-common = {path = "../../common", editable = true}

[dependency-groups]
dev = ["pytest==9.1.1", "ruff==0.17.2"]
