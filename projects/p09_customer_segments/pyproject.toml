[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "customer-segments"
version = "0.1.0"
description = "Customer segments of an online retailer from Online Retail II: RFM and product mix features, k means, DBSCAN, HDBSCAN, UMAP and bootstrap stability, checked on the next quarter"
requires-python = ">=3.11"
license = "MIT"
dependencies = [
    "numpy==2.5.4",
    "pandas==3.1.0",
    "pyarrow==25.0.1",
    "openpyxl==3.1.5",
    "scikit-learn==1.9.1",
    "umap-learn==0.5.12",
    "numba==0.68.0",
    "plotly==7.1.0",
    "joblib==1.6.0",
    "matplotlib==3.11.2",
    "tabulate==0.10.0",
    "mlflow==3.17.2",
]

[project.optional-dependencies]
dev = ["pytest==9.1.1", "ruff==0.17.2"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 110
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]
