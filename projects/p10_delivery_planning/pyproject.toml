[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "delivery-planning"
version = "0.1.0"
description = "Delivery routes with vehicle capacity and time windows on the Solomon VRPTW benchmark with OR-Tools, then driver shifts that cover the routes at minimum cost with a Pyomo mixed integer model"
requires-python = ">=3.11"
license = "MIT"
dependencies = [
    "numpy==2.5.4",
    "pandas==3.1.0",
    "pyarrow==25.0.1",
    "vrplib==2.2.0",
    "ortools==9.15.6755",
    "pyomo==6.10.1",
    "highspy==1.15.1",
    "cbcbox==2.935",
    "folium==0.20.0",
    "streamlit==1.66.1",
    "matplotlib==3.11.2",
    "tabulate==0.10.0",
    "mlflow==3.17.2",
]

[project.optional-dependencies]
dev = ["pytest==9.1.1", "ruff==0.17.2"]
# Gurobi's pip package carries a size limited license (2,000 variables and 2,000 constraints)
# for non production use. The solver comparison runs it only where a model fits that limit.
gurobi = ["gurobipy==13.0.3"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
delivery_planning = ["solomon_files.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 110
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]
