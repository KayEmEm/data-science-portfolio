[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "illicit-graph"
version = "0.1.0"
description = "Illicit Bitcoin transactions in the Elliptic graph: network statistics, centrality and communities in NetworkX, GCN and GraphSAGE in PyTorch Geometric against feature only LightGBM, on a temporal split, with a Neo4j load script"
requires-python = ">=3.11"
license = "MIT"
dependencies = [
    "numpy==2.5.4",
    "pandas==3.1.0",
    "pyarrow==25.0.1",
    "scikit-learn==1.9.1",
    "networkx==3.7",
    "torch==2.14.1",
    "torch-geometric==2.8.1",
    "lightgbm==4.7.0",
    "joblib==1.6.0",
    "matplotlib==3.11.2",
    "tabulate==0.10.0",
    "mlflow==3.17.2",
]

[project.optional-dependencies]
dev = ["pytest==9.1.1", "ruff==0.17.2"]
# The Python driver, only for loading the export into a running Neo4j server.
neo4j = ["neo4j==6.4.1"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 110
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]
