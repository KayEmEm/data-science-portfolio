[build-system]
requires = ["uv_build>=0.11.32,<0.12"]
build-backend = "uv_build"

[project]
name = "inventory-rl"
version = "0.1.0"
description = "Inventory control as reinforcement learning: a Gymnasium environment with demand fitted to M5 products, random lead times and lost sales; PPO and SAC from Stable Baselines3 against tuned (s, S) and base stock policies"
requires-python = ">=3.12"
license = "MIT"
dependencies = [
    "portfolio-common",
    "numpy==2.5.4",
    "pandas==3.1.0",
    "pyarrow==25.0.1",
    "scipy==1.18.1",
    "gymnasium==1.4.0",
    "stable-baselines3==2.9.0",
    "torch==2.14.1",
    "matplotlib==3.11.2",
    "pillow==13.0.0",
    "tabulate==0.10.0",
    "mlflow==3.17.2",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 110
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]

[tool.uv.sources]
portfolio-common = {path = "../../common", editable = true}
torch = {index = "pytorch-cpu"}

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[dependency-groups]
dev = ["pytest==9.1.1", "ruff==0.17.2"]
