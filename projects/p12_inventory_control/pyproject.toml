[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "inventory-rl"
version = "0.1.0"
description = "Inventory control as reinforcement learning: a Gymnasium environment with demand fitted to M5 products, random lead times and lost sales; PPO and SAC from Stable Baselines3 against tuned (s, S) and base stock policies"
requires-python = ">=3.11"
license = "MIT"
dependencies = [
    "numpy==2.5.4",
    "pandas==3.1.0",
    "pyarrow==25.0.1",
    "scipy==1.18.1",
    "gymnasium==1.4.0",
    "stable-baselines3==2.9.0",
    "torch==2.14.1",
    "matplotlib==3.11.2",
    "pillow==13.0.0",
    "tabulate==0.10.0",
    "mlflow==3.17.2",
]

[project.optional-dependencies]
dev = ["pytest==9.1.1", "ruff==0.17.2"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 110
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]
