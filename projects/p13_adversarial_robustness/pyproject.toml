[build-system]
requires = ["uv_build>=0.11.32,<0.12"]
build-backend = "uv_build"

[project]
name = "adv-robustness"
version = "0.1.0"
description = "Adversarial robustness of the portfolio's own models: evasion and poisoning attacks on projects 1, 6 and 8, and what each defense costs in clean performance"
requires-python = ">=3.12"
license = "AGPL-3.0-only"
# The target projects (loan-default, road-damage, flow-anomaly) come from their folders
# through [tool.uv.sources]; their pinned dependencies come with them.
dependencies = [
    "portfolio-common",
    "loan-default",
    "road-damage",
    "flow-anomaly",
    "numpy==2.5.4",
    "pandas==3.1.0",
    "pyarrow==25.0.1",
    "scipy==1.18.1",
    "scikit-learn==1.9.1",
    "lightgbm==4.7.0",
    "torch==2.14.1",
    "torchvision==0.29.1",
    "ultralytics==8.4.184",
    "adversarial-robustness-toolbox==1.20.1",
    "pillow==12.3.0",
    "matplotlib==3.11.2",
    "tabulate==0.10.0",
]
license-files = ["LICENSE"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 110
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]

[tool.uv.sources]
portfolio-common = {path = "../../common", editable = true}
loan-default = {path = "../p01_loan_default", editable = true}
road-damage = {path = "../p06_road_damage", editable = true}
flow-anomaly = {path = "../p08_network_anomaly", editable = true}
torch = {index = "pytorch-cpu"}
torchvision = {index = "pytorch-cpu"}

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[dependency-groups]
dev = ["pytest==9.1.1", "ruff==0.17.2"]
