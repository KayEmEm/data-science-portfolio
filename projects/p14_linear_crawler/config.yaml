start_url: https://example.com/series/1
download_dir: artifacts/files
cookie_file: data/raw/cookies.txt
crawl_log: artifacts/crawl.log
manifest_file: artifacts/manifest.csv
state_file: artifacts/crawl_state.json
debug_dir: artifacts/debug_pages
display_mode: visible
user_agent: ''
timeout_seconds: 30
max_pages: 0
min_page_delay: 10
max_page_delay: 25
max_download_retries: 5
min_firewall_sleep: 45
max_firewall_sleep: 120
max_retry_after_seconds: 3600
max_consecutive_failures: 3
max_browser_restarts: 3
context_restart_pages: 500
block_subresources: true
stream_downloads: false
reject_html_files: true
skip_saved: true
session_expired_pattern: null
halt_on_redirect: true
cookie_expiry_warn_hours: 24
console_level: INFO
log_max_bytes: 10485760
log_backups: 5
escape_key_stop: true
file_link_pattern: href="([^"]*)"(?=[^>]*>Download file<)
next_page_pattern: href="([^"]*)"[^>]*rel="next"
