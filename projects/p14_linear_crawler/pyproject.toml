[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "linear-crawler"
version = "0.1.0"
description = "Linear page series crawler: follows a chain of pages with Playwright, saves one file per page and stops at the page that links to itself; retries, back off, session checks, resume and three display modes"
requires-python = ">=3.11"
license = "MIT"
dependencies = [
    "playwright==1.63.0",
    "PyYAML==6.0.3",
]

[project.optional-dependencies]
dev = ["pytest==9.1.1", "ruff==0.17.2"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 110
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]
