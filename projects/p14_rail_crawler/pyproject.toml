[build-system]
requires = ["uv_build>=0.11.32,<0.12"]
build-backend = "uv_build"

[project]
name = "rail-spider"
version = "0.1.0"
description = "Rail crawler: follows a linear chain of pages with Playwright, saves one file per page and stops at the page that links to itself; retries, back off, session checks, resume, gap filling and three display modes"
requires-python = ">=3.11"
license = "MIT"
dependencies = [
    "playwright==1.63.0",
    "PyYAML==6.0.3",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 110
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]

[dependency-groups]
dev = ["pytest==9.1.1", "ruff==0.17.2"]
